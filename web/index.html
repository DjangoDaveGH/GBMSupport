<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PFM-Systems Division support and ticketing centre for GBMS budgeting-system issues.">
  <meta name="theme-color" content="#0B3578">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GBMS Support">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GBMS Support Centre</title>
  <link rel="manifest" href="manifest.json">

  <!-- Branded loading screen, shown before the Flutter engine has even
       downloaded/booted — matches SplashScreen (lib/features/auth/
       presentation/splash_screen.dart) so there's no blank-white gap
       before the in-app splash takes over. Removed on 'flutter-first-frame'. -->
  <style>
    #hyport-loading {
      position: fixed;
      inset: 0;
      background: #0A1B3D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'PlusJakartaSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      z-index: 9999;
    }
    #hyport-loading img {
      width: 84px;
      height: 84px;
      margin-bottom: 16px;
    }
    #hyport-loading .title {
      color: #E0A62E;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.5px;
      text-align: center;
      line-height: 1.3;
    }
    #hyport-loading .subtitle {
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="hyport-loading">
    <img src="splash_logo.png" alt="" />
    <div class="title">GBMS<br />SUPPORT CENTRE</div>
    <div class="subtitle">Budget Management Platform</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('hyport-loading');
      if (loading) loading.remove();
    });
  </script>

  <!-- "Click to install" bridge for the in-app Install button
       (core/services/pwa_install_web.dart). Captures the browser's
       beforeinstallprompt event as early as possible (before the Flutter
       engine even boots) and exposes a plain-JS surface Dart polls via
       dart:js_util, since beforeinstallprompt has no Dart-side API. -->
  <script>
    window.hyportPwaInstall = { deferredPrompt: null, available: false, installed: false };

    // Already running as an installed PWA — never offer to install again.
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
      window.hyportPwaInstall.installed = true;
    }

    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.hyportPwaInstall.deferredPrompt = event;
      window.hyportPwaInstall.available = true;
    });

    window.addEventListener('appinstalled', function () {
      window.hyportPwaInstall.available = false;
      window.hyportPwaInstall.installed = true;
      window.hyportPwaInstall.deferredPrompt = null;
    });

    window.hyportPwaInstallPrompt = async function () {
      var deferred = window.hyportPwaInstall.deferredPrompt;
      if (!deferred) return 'unavailable';
      deferred.prompt();
      var choice = await deferred.userChoice;
      window.hyportPwaInstall.deferredPrompt = null;
      window.hyportPwaInstall.available = false;
      return choice.outcome; // 'accepted' | 'dismissed'
    };
  </script>

  <!-- Real OS notification-bar pop-up (with sound — the browser plays its
       own default notification sound automatically) for a *foreground*
       FCM message. firebase-messaging-sw.js's background handler already
       covers the tab-not-focused case; PushNotificationListener calls this
       for the tab-focused case, which Firebase's web SDK never surfaces as
       a system notification on its own (core/services/web_notification.dart
       / local_notification_service.dart). Notification permission is
       already granted by the time this fires — requested earlier via
       firebase_messaging's requestPermission(), same underlying browser
       permission. -->
  <script>
    // Show a real OS notification for a foreground FCM message. Goes through
    // the service-worker registration (registration.showNotification) rather
    // than `new Notification()` because the constructor THROWS on Android
    // Chrome and is silent/deprecated on mobile — the SW path works
    // everywhere, vibrates, and lets the OS play its notification sound.
    window.hyportShowNotification = function (title, body, ticketId) {
      if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
      var options = {
        body: body,
        icon: 'icons/Icon-192.png',
        badge: 'icons/Icon-192.png',
        tag: 'gbms-support',
        renotify: true,
        silent: false,
        vibrate: [200, 100, 200],
        requireInteraction: false,
        data: { ticketId: ticketId || '', url: ticketId ? ('/#/tickets/' + ticketId) : '/' }
      };
      if ('serviceWorker' in navigator && navigator.serviceWorker.ready) {
        navigator.serviceWorker.ready
          .then(function (reg) { return reg.showNotification(title, options); })
          .catch(function () {
            try { new Notification(title, options); } catch (e) {}
          });
      } else {
        try { new Notification(title, options); } catch (e) {}
      }
    };
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
