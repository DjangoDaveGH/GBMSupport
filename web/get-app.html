<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get GBMS Support</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>
    :root {
      color-scheme: light;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0A1B3D;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #14213D;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 32px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.25);
    }
    .card img.logo {
      width: 64px;
      height: 64px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 6px;
      color: #0B3578;
    }
    p.subtitle {
      font-size: 14px;
      color: #55607A;
      margin: 0 0 22px;
    }
    .qr {
      width: 200px;
      height: 200px;
      margin: 0 auto 22px;
      border-radius: 12px;
      border: 1px solid #E9EFF6;
      padding: 10px;
      box-sizing: border-box;
    }
    .qr img {
      width: 100%;
      height: 100%;
    }
    a.btn {
      display: block;
      text-decoration: none;
      padding: 13px 20px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 10px;
    }
    a.btn.primary {
      background: #0B3578;
      color: #ffffff;
    }
    a.btn.secondary {
      background: #F4F7FB;
      color: #0B3578;
      border: 1px solid #E9EFF6;
    }
    p.hint {
      font-size: 12px;
      color: #8592A8;
      margin-top: 18px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="splash_logo.png" alt="" />
    <h1>Get GBMS Support</h1>
    <p class="subtitle">Scan with your phone, or choose your platform below.</p>
    <div class="qr">
      <img src="get-app-qr.png" alt="QR code linking to this page" />
    </div>
    <a class="btn primary" href="downloads/gbms-support.apk">Download for Android</a>
    <a class="btn secondary" href="/">Open the web app (iOS / desktop)</a>
    <p class="hint">iPhone/iPad users: open the web app, then use Share &rarr; "Add to Home Screen" to install it.</p>
  </div>
  <script>
    // Auto-redirect only on an actual phone visiting this link directly
    // (i.e. someone who just scanned the QR code) — not on desktop, where
    // the fallback buttons/QR above are the whole point of the page.
    var ua = navigator.userAgent || '';
    var isAndroid = /Android/i.test(ua);
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (ua.includes('Macintosh') && 'ontouchend' in document);
    if (isAndroid) {
      window.location.replace('downloads/gbms-support.apk');
    } else if (isIOS) {
      window.location.replace('/');
    }
  </script>
</body>
</html>
